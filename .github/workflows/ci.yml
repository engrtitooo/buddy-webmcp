name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Build the production extension
        env:
          BUDDY_API_BASE_URL: https://api.example.com
        run: npm run build:production -w @buddy/extension
      - name: Verify the production API host permission
        run: npm run verify:production-manifest -w @buddy/extension
